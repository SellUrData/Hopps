name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Compile check (no signing secrets configured)
        if: env.ASC_KEY_ID == ''
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Check signing IDs
        if: env.ASC_KEY_ID != ''
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]"'; }
          team=$(trim "$APPLE_TEAM_ID"); key=$(trim "$ASC_KEY_ID"); issuer=$(trim "$ASC_ISSUER_ID")
          ok=1
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID should be 10 uppercase letters/digits (got ${#team} chars)"; ok=0; }
          [[ "$key" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID should be 10 uppercase letters/digits (got ${#key} chars)"; ok=0; }
          [[ "$issuer" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::ASC_ISSUER_ID should be a 36-char UUID (got ${#issuer} chars)"; ok=0; }
          [ "$team" != "$key" ] || { echo "::error::APPLE_TEAM_ID is the same as ASC_KEY_ID"; ok=0; }
          [ $ok = 1 ] || exit 1
          { echo "APPLE_TEAM_ID=$team"; echo "ASC_KEY_ID=$key"; echo "ASC_ISSUER_ID=$issuer"; } >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          # Accept the .p8 pasted with or without header lines, collapsed newlines, or base64-encoded.
          raw=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          decoded=$(printf '%s' "$raw" | tr -d ' \n\t' | base64 -D 2>/dev/null || true)
          case "$decoded" in *"BEGIN PRIVATE KEY"*) raw="$decoded" ;; esac
          body=$(printf '%s' "$raw" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t"')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s\n' "$body" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid private key (body length ${#body}). Re-paste the full contents of AuthKey_XXXX.p8."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Archive
        if: env.ASC_KEY_ID != ''
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != ''
        run: |
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
